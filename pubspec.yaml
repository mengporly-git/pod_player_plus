name: pod_player_plus
description: Vimeo and youtube player for flutter last version, Pod player provides customizable video player controls that support android, ios and web.
version: 0.3.1
homepage: https://github.com/mengporly-git/pod_player_plus

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # services
  video_player: ^2.13.0
  http: ^1.6.0
  get: ^4.7.3
  universal_html: ^2.3.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

screenshots:
  - description: Pod video player logo
    path: screenshots/logo.png
