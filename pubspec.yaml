version: 0.4.1
homepage: https://github.com/mengporly-git/pod_player_plus

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  # services
  video_player: ^2.14.1
  http: ^1.6.0
  get: ^4.7.3
  universal_html: ^2.3.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
